[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maxmig"
version = "0.2.0"
description = "IBM Maximo / MAS data migration CLI — API-based extract/CSV/load between environments"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "click>=8.1",
]

[project.optional-dependencies]
# Read/write MxLoader .xlsx/.xlsm workbooks with `migrate mxl` (CSV sheets need nothing extra).
excel = [
    "openpyxl>=3.1",
]
dev = [
    "pytest>=8.0",
    "requests-mock>=1.12",
    "openpyxl>=3.1",
]

[project.scripts]
migrate = "maxmig.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
